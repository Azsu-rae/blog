{% extends "base.html" %}
{% load static %}
{% block script %}
  <script src="{% static 'blog/js/favorites.js' %}" defer></script>
{% endblock script %}
{% block content %}
  <ul>
    {% for i in items %}
      <li>
        <a href="{% url content_url i.id %}">{{ i.name }}</a>
        {% if item_type == "notes" %}
          <button type="button"
                  class="star-button {% if i.is_favorite %}filled{% else %}empty{% endif %}"
                  data-note-id="{{ i.id }}">
            <span>&#9733;</span> <!-- ★ -->
          </button>
        {% endif %}
      </li>
    {% empty %}
      <li>No {{ item_type }} found.</li>
    {% endfor %}
  </ul>
{% endblock content %}
