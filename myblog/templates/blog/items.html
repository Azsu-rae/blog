<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>{{ item_type }}</title>
</head>

<body>
  <ul>
    {% for i in items %}
    <li><a href="{% url content_url i.id %}">{{ i.name }}</a></li>
    {% empty %}
    <li>No {{ item_type }} found.</li>
    {% endfor %}
  </ul>
</body>

</html>
